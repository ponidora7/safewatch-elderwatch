services:
  - type: web
    name: safewatch-api
    runtime: python
    region: singapore # Closest to Indonesia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "8000"
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      # Set secrets via Render dashboard, NOT here:
      # SUPABASE_URL, SUPABASE_KEY, RESEND_API_KEY, EMAIL_FROM, EMAIL_TO
    autoDeploy: true
    # Disk for model persistence (optional, model included in repo)
    # disk:
    #   name: models-disk
    #   mountPath: /opt/render/project/src/models
    #   sizeGB: 1
